<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SWINGBY effects</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600&amp;family=Michroma&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;color:inherit;cursor:pointer;margin:0}
a{text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 860px; overflow: hidden; font-family: 'Barlow Condensed', sans-serif; color: {{c.text}}; background: {{c.bg}};">

    <div aria-hidden="true" style="position: absolute; inset: 0; background-image: radial-gradient(1.2px 1.2px at 8% 14%, rgba(255,255,255,.55), rgba(0,0,0,0)), radial-gradient(1px 1px at 33% 42%, rgba(255,255,255,.4), rgba(0,0,0,0)), radial-gradient(1.4px 1.4px at 57% 9%, rgba(191,243,223,.6), rgba(0,0,0,0)), radial-gradient(1px 1px at 84% 36%, rgba(255,255,255,.35), rgba(0,0,0,0)), radial-gradient(1.2px 1.2px at 71% 22%, rgba(255,255,255,.5), rgba(0,0,0,0));"></div>

      <svg viewBox="58 8 140 240" width="11" height="19" aria-hidden="true" style="display: block; color: {{c.cat}};"><path fill="currentColor" fill-rule="evenodd" d="M82 8H174A24 24 0 0 1 198 32V224A24 24 0 0 1 174 248H82A24 24 0 0 1 58 224V32A24 24 0 0 1 82 8ZM110 34H146A18 18 0 0 1 146 70H110A18 18 0 0 1 110 34ZM110 186H146A18 18 0 0 1 146 222H110A18 18 0 0 1 110 186Z"></path></svg>
      <span style="font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; line-height: 14px; padding: 2px 6px; border-radius: 3px; background: #22a87c; color: #0c0c0d;">IN07</span>
      <img src="{{c.logo}}" alt="SWINGBY" style="display: block; height: 11px; width: 87px;">
    </div>
    <nav aria-label="Screens" style="display: flex; align-items: center; gap: 4px;">
      <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="5">
        <a href="{{tb.href}}" aria-current="{{tb.current}}" style="height: 44px; min-width: 64px; padding: 0 12px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; letter-spacing: .3em; {{tb.look}}">{{tb.label}}</a>
      </sc-for>
    </nav>
    <div style="display: flex; align-items: center; justify-content: flex-end; gap: 16px; width: 300px;">
      <div role="radiogroup" aria-label="Motion" style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 11px; letter-spacing: .26em; color: {{c.sub}};">MOTION</span>
        <div style="display: flex; border: 1px solid {{c.line2}}; border-radius: 13px; overflow: hidden;">
          <sc-for list="{{motionOpts}}" as="m" hint-placeholder-count="3">
            <button type="button" role="radio" aria-checked="{{m.on}}" title="{{m.title}}" onClick="{{m.pick}}" style="height: 26px; min-width: 40px; padding: 0 9px; border: none; font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .06em; {{m.look}}">{{m.label}}</button>
          </sc-for>
        </div>
      </div>
      <span style="display: inline-flex; align-items: center; gap: 7px; font-size: 11px; letter-spacing: .22em; color: {{c.sub}};"><span style="width: 6px; height: 6px; border-radius: 50%; background: #2bd14a;"></span>SW LINK</span>
    </div>
  </header>

  <svg viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-label="{{aria}}" style="position: absolute; left: 0; top: 56px; display: block;">
    <defs>
      <radialGradient id="fxGlow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#8de0c3" stop-opacity=".55"></stop><stop offset="1" stop-color="#8de0c3" stop-opacity="0"></stop></radialGradient>
    </defs>
    <path d="{{path}}" fill="none" stroke="{{c.cat}}" stroke-opacity=".35" stroke-width="1.4"></path>
    <path d="{{path}}" fill="none" stroke="{{c.acc}}" stroke-opacity=".5" stroke-width="1.4" stroke-dasharray="2 10" stroke-dashoffset="{{flow}}"></path>
    <sc-for list="{{stations}}" as="st" hint-placeholder-count="6">
      <circle cx="{{st.x}}" cy="{{st.y}}" r="52" fill="url(#fxGlow)" opacity="{{st.glow}}"></circle>
      <circle cx="{{st.x}}" cy="{{st.y}}" r="40" fill="none" stroke="{{c.acc}}" stroke-opacity="{{st.ring}}" stroke-width="1" stroke-dasharray="{{st.dash}}"></circle>
    </sc-for>
    <circle cx="1200" cy="214" r="6" fill="none" stroke="{{c.acc}}" stroke-opacity=".6" stroke-width="1.4"></circle>
  </svg>
  <sc-for list="{{stations}}" as="st" hint-placeholder-count="6">
    <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: {{st.sp.s}}px; height: {{st.sp.s}}px; overflow: hidden; opacity: {{st.op}}; filter: {{st.filter}}; transform: translate3d({{st.sp.left}}px, {{st.sp.top}}px, 0); will-change: transform;">
      <img src="{{st.sp.src}}" alt="" style="display: block; max-width: none; width: {{st.sp.bw}}px; height: {{st.sp.bh}}px; transform: translate3d({{st.sp.bx}}px, {{st.sp.by}}px, 0); will-change: transform;">
    </div>
    <div style="position: absolute; left: {{st.lx}}px; top: {{st.ly}}px; width: 140px; display: flex; flex-direction: column; align-items: center; gap: 2px; pointer-events: none;">

      <span style="font-family: 'Space Mono', monospace; font-size: 10px; color: {{c.sub}};">{{st.sub}}</span>
    </div>
  </sc-for>
  <svg viewBox="0 0 1280 380" width="1280" height="380" aria-hidden="true" style="position: absolute; left: 0; top: 56px; display: block; pointer-events: none;">
    <sc-for list="{{trail}}" as="d" hint-placeholder-count="12">
      <circle cx="{{d.x}}" cy="{{d.y}}" r="{{d.r}}" fill="{{c.trail}}" fill-opacity="{{d.op}}"></circle>
    </sc-for>
    <circle cx="{{probe.x}}" cy="{{probe.y}}" r="14" fill="url(#fxGlow2)"></circle>
    <circle cx="{{probe.x}}" cy="{{probe.y}}" r="4" fill="{{c.probe}}"></circle>
    <defs>
      <radialGradient id="fxGlow2" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#8de0c3" stop-opacity=".55"></stop><stop offset="1" stop-color="#8de0c3" stop-opacity="0"></stop></radialGradient>

  </svg>
  <span style="position: absolute; left: 1180px; top: 284px; width: 40px; text-align: center; font-family: 'Space Mono', monospace; font-size: 11px; color: {{c.label}};">OUT</span>
  <img src="{{c.core}}" alt="" style="position: absolute; left: 30px; top: 210px; width: 120px; height: 120px; display: block;">
  <span style="position: absolute; left: 40px; top: 336px; font-size: 11px; letter-spacing: .3em; color: {{c.label}};">THE VOICE</span>

  <span style="position: absolute; left: 24px; top: 446px; font-size: 11px; letter-spacing: .34em; color: {{c.label}};">EFFECTS · AFTER THE VOICES, IN THIS ORDER</span>

        <div style="margin-top: auto; display: flex; gap: 6px;">

        </div>
      </div>
    </sc-for>
  </section>
</div>
</x-dc>

        toggle: function () { var nm = Object.assign({}, onMap); nm[k] = !en; self.setState({ on: nm }); },
        rows: FX[k].p.map(function (p, pi) { var v = val(k, pi); return { id: 'fx-' + k + '-' + pi, label: p[0], v: v, text: p[2](v), change: function (e) { setVal(k, pi, Number(e.target.value)); } }; }),
        first: i === 0, last: i === order.length - 1, leftOp: i === 0 ? 0.3 : 1, rightOp: i === order.length - 1 ? 0.3 : 1,
        leftAria: 'Move ' + FX[k].name + ' earlier', rightAria: 'Move ' + FX[k].name + ' later',
        left: function () { move(i, -1); }, right: function () { move(i, 1); }
      };
    });
    var tabs = [['PLAY', 'SW_Main.dc.html'], ['LAYER', 'SW_Layer.dc.html'], ['ARP', 'SW_Arp.dc.html'], ['MOD', 'SW_Mod.dc.html'], ['FX', 'SW_FX.dc.html']].map(function (x, i) {
      return { label: x[0], href: x[1], current: i === 4 ? 'page' : 'false', look: i === 4 ? 'color: ' + c.strong + '; box-shadow: inset 0 -2px 0 ' + c.cat + ';' : 'color: ' + c.sub + ';' };
    });
    var motionOpts = [['60', '60', 'Full motion: every display frame'], ['30', '30', 'Lighter: 30 frames a second'], ['off', 'OFF', 'No motion: a still picture (values still update it)']].map(function (x) {
      var sel = motion === x[0];
      return { label: x[1], title: x[2], on: sel ? 'true' : 'false', look: sel ? on : 'background: none; color: ' + c.sub + ';', pick: function () { self.setMotion(x[0]); } };
    });
    return {
      theme: theme, c: c,
      tabs: tabs, motionOpts: motionOpts, path: d, flow: f1(-(t * 30) % 12), stations: stations, cards: cards, trail: trail,
      probe: { x: f1(pp[0]), y: f1(pp[1]) },
      aria: 'Signal path: from the voice through ' + order.filter(function (k) { return onMap[k]; }).map(function (k) { return FX[k].name.toLowerCase(); }).join(', ') + ' to the output'
    };
  }
}
</script>
