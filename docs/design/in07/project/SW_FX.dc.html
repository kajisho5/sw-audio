<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SWINGBY effects</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600&amp;family=Michroma&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;color:inherit;cursor:pointer;margin:0}
a{text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 860px; overflow: hidden; font-family: 'Barlow Condensed', sans-serif; color: #e8e8e8; background: radial-gradient(ellipse 70% 45% at 40% 30%, #0e1516 0, #070a0b 50%, #030405 100%);">
  <div aria-hidden="true" style="position: absolute; inset: 0; background-image: radial-gradient(1.2px 1.2px at 8% 14%, rgba(255,255,255,.55), rgba(0,0,0,0)), radial-gradient(1px 1px at 33% 42%, rgba(255,255,255,.4), rgba(0,0,0,0)), radial-gradient(1.4px 1.4px at 57% 9%, rgba(191,243,223,.6), rgba(0,0,0,0)), radial-gradient(1px 1px at 84% 36%, rgba(255,255,255,.35), rgba(0,0,0,0)), radial-gradient(1.2px 1.2px at 71% 22%, rgba(255,255,255,.5), rgba(0,0,0,0));"></div>

  <header style="position: absolute; left: 24px; right: 24px; top: 0; height: 56px; display: flex; align-items: center; justify-content: space-between;">
    <div style="display: flex; align-items: center; gap: 10px; width: 300px;">
      <svg viewBox="58 8 140 240" width="11" height="19" aria-hidden="true" style="display: block; color: #3fd1a0;"><path fill="currentColor" fill-rule="evenodd" d="M82 8H174A24 24 0 0 1 198 32V224A24 24 0 0 1 174 248H82A24 24 0 0 1 58 224V32A24 24 0 0 1 82 8ZM110 34H146A18 18 0 0 1 146 70H110A18 18 0 0 1 110 34ZM110 186H146A18 18 0 0 1 146 222H110A18 18 0 0 1 110 186Z"></path></svg>
      <span style="font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; line-height: 14px; padding: 2px 6px; border-radius: 3px; background: #22a87c; color: #0c0c0d;">IN07</span>
      <img src="/_blob/eea73410a66867fa6abf11bd1a56eee6" alt="SWINGBY" style="display: block; height: 11px; width: 87px;">
    </div>
    <nav aria-label="Screens" style="display: flex; align-items: center; gap: 4px;">
      <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="5">
        <a href="{{tb.href}}" aria-current="{{tb.current}}" style="height: 44px; min-width: 64px; padding: 0 12px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; letter-spacing: .3em; {{tb.look}}">{{tb.label}}</a>
      </sc-for>
    </nav>
    <div style="display: flex; align-items: center; justify-content: flex-end; gap: 16px; width: 300px;">
      <div role="radiogroup" aria-label="Motion" style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 11px; letter-spacing: .26em; color: #8e8e8e;">MOTION</span>
        <div style="display: flex; border: 1px solid rgba(141,224,195,.35); border-radius: 13px; overflow: hidden;">
          <sc-for list="{{motionOpts}}" as="m" hint-placeholder-count="3">
            <button type="button" role="radio" aria-checked="{{m.on}}" title="{{m.title}}" onClick="{{m.pick}}" style="height: 26px; min-width: 40px; padding: 0 9px; border: none; font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .06em; {{m.look}}">{{m.label}}</button>
          </sc-for>
        </div>
      </div>
      <span style="display: inline-flex; align-items: center; gap: 7px; font-size: 11px; letter-spacing: .22em; color: #8e8e8e;"><span style="width: 6px; height: 6px; border-radius: 50%; background: #2bd14a;"></span>SW LINK</span>
    </div>
  </header>

  <svg viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-label="{{aria}}" style="position: absolute; left: 0; top: 56px; display: block;">
    <defs>
      <radialGradient id="fxGlow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#8de0c3" stop-opacity=".55"></stop><stop offset="1" stop-color="#8de0c3" stop-opacity="0"></stop></radialGradient>
    </defs>
    <path d="{{path}}" fill="none" stroke="#3fd1a0" stroke-opacity=".35" stroke-width="1.4"></path>
    <path d="{{path}}" fill="none" stroke="#8de0c3" stroke-opacity=".5" stroke-width="1.4" stroke-dasharray="2 10" stroke-dashoffset="{{flow}}"></path>
    <sc-for list="{{stations}}" as="st" hint-placeholder-count="6">
      <circle cx="{{st.x}}" cy="{{st.y}}" r="46" fill="url(#fxGlow)" opacity="{{st.glow}}"></circle>
      <circle cx="{{st.x}}" cy="{{st.y}}" r="24" fill="{{st.fill}}" stroke="#8de0c3" stroke-opacity="{{st.ring}}" stroke-width="1.4" stroke-dasharray="{{st.dash}}"></circle>
      <text x="{{st.x}}" y="{{st.ly}}" fill="{{st.ink}}" font-family="Michroma, sans-serif" font-size="11" letter-spacing="2" text-anchor="middle">{{st.name}}</text>
      <text x="{{st.x}}" y="{{st.vy}}" fill="#8e8e8e" font-family="Space Mono, monospace" font-size="10" text-anchor="middle">{{st.sub}}</text>
      <text x="{{st.x}}" y="{{st.ny}}" fill="{{st.ink}}" font-family="Space Mono, monospace" font-size="11" text-anchor="middle">{{st.no}}</text>
    </sc-for>
    <sc-for list="{{trail}}" as="d" hint-placeholder-count="12">
      <circle cx="{{d.x}}" cy="{{d.y}}" r="{{d.r}}" fill="#bff3df" fill-opacity="{{d.op}}"></circle>
    </sc-for>
    <circle cx="{{probe.x}}" cy="{{probe.y}}" r="14" fill="url(#fxGlow)"></circle>
    <circle cx="{{probe.x}}" cy="{{probe.y}}" r="4" fill="#e8fff6"></circle>
    <text x="1200" y="238" fill="#a8a8a8" font-family="Space Mono, monospace" font-size="11" text-anchor="middle">OUT</text>
    <circle cx="1200" cy="214" r="6" fill="none" stroke="#8de0c3" stroke-opacity=".6" stroke-width="1.4"></circle>
  </svg>
  <img src="/_blob/90121e1a7bee5f359e51e024081e48ca" alt="" style="position: absolute; left: 30px; top: 210px; width: 120px; height: 120px; display: block;">
  <span style="position: absolute; left: 40px; top: 336px; font-size: 11px; letter-spacing: .3em; color: #a8a8a8;">THE VOICE</span>

  <span style="position: absolute; left: 24px; top: 446px; font-size: 11px; letter-spacing: .34em; color: #a8a8a8;">EFFECTS · AFTER THE VOICES, IN THIS ORDER</span>
  <section aria-label="Effect slots" style="position: absolute; left: 24px; right: 24px; top: 470px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px;">
    <sc-for list="{{cards}}" as="cd" hint-placeholder-count="6">
      <div style="height: 366px; box-sizing: border-box; padding: 14px; display: flex; flex-direction: column; gap: 10px; border-radius: 16px; border: 1px solid {{cd.line}}; background: linear-gradient(200deg, rgba(255,255,255,.06), rgba(255,255,255,.015) 60%); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 20px 50px rgba(0,0,0,.45); opacity: {{cd.op}};">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8de0c3;">{{cd.no}}</span>
          <button type="button" aria-pressed="{{cd.pressed}}" aria-label="{{cd.onAria}}" onClick="{{cd.toggle}}" style="width: 52px; height: 28px; border: 1px solid; border-radius: 14px; font-family: 'Space Mono', monospace; font-size: 9px; {{cd.onLook}}">{{cd.onLabel}}</button>
        </div>
        <span style="font-family: Michroma, sans-serif; font-size: 15px; letter-spacing: .14em; color: #f2f2f2;">{{cd.name}}</span>
        <sc-for list="{{cd.rows}}" as="r" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <div style="display: flex; justify-content: space-between; align-items: baseline;"><label for="{{r.id}}" style="font-size: 11px; letter-spacing: .2em; color: #cacaca;">{{r.label}}</label><span style="font-family: 'Space Mono', monospace; font-size: 10px; color: #f2f2f2;">{{r.text}}</span></div>
            <input id="{{r.id}}" type="range" min="0" max="100" step="1" value="{{r.v}}" onChange="{{r.change}}" style="width: 100%; margin: 0; accent-color: #3fd1a0;">
          </div>
        </sc-for>
        <div style="margin-top: auto; display: flex; gap: 6px;">
          <button type="button" onClick="{{cd.left}}" disabled="{{cd.first}}" aria-label="{{cd.leftAria}}" style="flex: 1; height: 36px; border: 1px solid rgba(141,224,195,.25); border-radius: 18px; background: none; color: #cacaca; opacity: {{cd.leftOp}};"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M7.5 2.5 4 6l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
          <button type="button" onClick="{{cd.right}}" disabled="{{cd.last}}" aria-label="{{cd.rightAria}}" style="flex: 1; height: 36px; border: 1px solid rgba(141,224,195,.25); border-radius: 18px; background: none; color: #cacaca; opacity: {{cd.rightOp}};"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5 8 6l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
        </div>
      </div>
    </sc-for>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  // the probe flying along the path: its own loop, with the same MOTION switch as the other screens
  componentDidMount() {
    var self = this;
    this._alive = true; this._last = 0; this._raf = 0;
    var reduce = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    this._motion = reduce ? 'off' : '60';
    if (reduce) this.setState({ motion: 'off' });
    this._tick = function (ts) {
      self._raf = 0;
      if (!self._alive || self._motion === 'off') return;
      var hidden = typeof document !== 'undefined' && document.hidden;
      if (!hidden && (self._motion === '60' || ts - self._last >= 1000 / 30 - 4)) { self._last = ts; self.setState({ t: ts / 1000 }); }
      self._raf = requestAnimationFrame(self._tick);
    };
    if (this._motion !== 'off') this._raf = requestAnimationFrame(this._tick);
  }
  componentWillUnmount() { this._alive = false; if (this._raf) cancelAnimationFrame(this._raf); this._raf = 0; }
  setMotion(m) {
    this._motion = m; this.setState({ motion: m });
    if (m !== 'off' && !this._raf && this._alive) this._raf = requestAnimationFrame(this._tick);
  }
  renderVals() {
    var self = this, s = this.state || {}, t = s.t || 0;
    var on = 'background: linear-gradient(180deg, #8de0c3 -30%, #22a87c 70%); color: #0c0c0d;';
    var motion = s.motion || '60';
    var f1 = function (x) { return Math.round(x * 10) / 10; };
    // the six effects (design values); params are 0..100 slider positions with their own readouts
    var FX = {
      drive: { name: 'DRIVE', p: [['AMOUNT', 30, function (v) { return v + ' %'; }], ['TONE', 60, function (v) { return v + ' %'; }], ['MIX', 100, function (v) { return v + ' %'; }]] },
      chorus: { name: 'CHORUS', p: [['RATE', 30, function (v) { return (0.05 * Math.pow(100, v / 100)).toFixed(2) + ' Hz'; }], ['DEPTH', 40, function (v) { return v + ' %'; }], ['MIX', 35, function (v) { return v + ' %'; }]] },
      delay: { name: 'DELAY', p: [['TIME', 50, function (v) { return ['1/16', '1/8', '1/8 D', '1/4', '1/4 D', '1/2'][Math.min(5, Math.floor(v / 17))]; }], ['FEEDBACK', 35, function (v) { return v + ' %'; }], ['MIX', 22, function (v) { return v + ' %'; }]] },
      reverb: { name: 'REVERB', p: [['SIZE', 55, function (v) { return (0.3 * Math.pow(40, v / 100)).toFixed(1) + ' s'; }], ['DAMP', 40, function (v) { return v + ' %'; }], ['MIX', 30, function (v) { return v + ' %'; }]] },
      eq: { name: 'EQ', p: [['LOW', 56, function (v) { var d = (v - 50) * 0.24; return (d > 0 ? '+' : '') + d.toFixed(1) + ' dB'; }], ['MID', 50, function (v) { var d = (v - 50) * 0.24; return (d > 0 ? '+' : '') + d.toFixed(1) + ' dB'; }], ['HIGH', 58, function (v) { var d = (v - 50) * 0.24; return (d > 0 ? '+' : '') + d.toFixed(1) + ' dB'; }]] },
      limit: { name: 'LIMIT', p: [['GAIN', 20, function (v) { return '+' + (v * 0.12).toFixed(1) + ' dB'; }], ['CEILING', 92, function (v) { return (-(100 - v) * 0.12).toFixed(1) + ' dB'; }], ['RELEASE', 40, function (v) { return Math.round(10 * Math.pow(50, v / 100)) + ' ms'; }]] }
    };
    var order = s.order || ['drive', 'chorus', 'delay', 'reverb', 'eq', 'limit'];
    var onMap = s.on || { drive: true, chorus: true, delay: true, reverb: true, eq: false, limit: true };
    var vals = s.vals || {};
    var val = function (k, i) { var a = vals[k]; return a && a[i] !== undefined ? a[i] : FX[k].p[i][1]; };
    var setVal = function (k, i, v) { var nv = Object.assign({}, vals); var a = (nv[k] || FX[k].p.map(function (q) { return q[1]; })).slice(); a[i] = v; nv[k] = a; self.setState({ vals: nv }); };
    var move = function (i, d) { var o = order.slice(), j = i + d; if (j < 0 || j >= o.length) return; var x = o[i]; o[i] = o[j]; o[j] = x; self.setState({ order: o }); };

    // the path: from the voice (left) around each station in turn (a swing-by: alternately over and under), out on the right
    var pts = [[150, 214]], st = [];
    order.forEach(function (k, i) {
      var x = 270 + i * 160, up = i % 2 === 0, y = up ? 150 : 278;
      st.push({ k: k, x: x, y: y });
      pts.push([x - 34, y + (up ? 44 : -44)]); pts.push([x + 34, y + (up ? 44 : -44)]);
    });
    pts.push([1200, 214]);
    var d = 'M' + pts[0][0] + ' ' + pts[0][1];
    for (var i = 1; i < pts.length; i++) {   // Catmull-Rom through the points, as cubic Beziers
      var p0 = pts[Math.max(0, i - 2)], p1 = pts[i - 1], p2 = pts[i], p3 = pts[Math.min(pts.length - 1, i + 1)];
      d += 'C' + f1(p1[0] + (p2[0] - p0[0]) / 6) + ' ' + f1(p1[1] + (p2[1] - p0[1]) / 6) + ' ' + f1(p2[0] - (p3[0] - p1[0]) / 6) + ' ' + f1(p2[1] - (p3[1] - p1[1]) / 6) + ' ' + p2[0] + ' ' + p2[1];
    }
    // the probe: sample the same curve
    var samples = [];
    for (var j = 1; j < pts.length; j++) {
      var a0 = pts[Math.max(0, j - 2)], a1 = pts[j - 1], a2 = pts[j], a3 = pts[Math.min(pts.length - 1, j + 1)];
      var c1 = [a1[0] + (a2[0] - a0[0]) / 6, a1[1] + (a2[1] - a0[1]) / 6], c2 = [a2[0] - (a3[0] - a1[0]) / 6, a2[1] - (a3[1] - a1[1]) / 6];
      for (var q = 0; q < 24; q++) {
        var u = q / 24, w = 1 - u;
        samples.push([w * w * w * a1[0] + 3 * w * w * u * c1[0] + 3 * w * u * u * c2[0] + u * u * u * a2[0], w * w * w * a1[1] + 3 * w * w * u * c1[1] + 3 * w * u * u * c2[1] + u * u * u * a2[1]]);
      }
    }
    samples.push(pts[pts.length - 1]);
    var at = function (ph) { var k = Math.min(samples.length - 1, Math.max(0, ph * (samples.length - 1))), k0 = Math.floor(k), fr = k - k0, b = samples[Math.min(samples.length - 1, k0 + 1)], a = samples[k0]; return [a[0] + (b[0] - a[0]) * fr, a[1] + (b[1] - a[1]) * fr]; };
    var ph = (t * 0.16) % 1, pp = at(ph), trail = [];
    for (var n = 1; n <= 12; n++) { var tp = ph - n * 0.006; if (tp < 0) break; var q2 = at(tp); trail.push({ x: f1(q2[0]), y: f1(q2[1]), r: f1(3 - n * 0.2), op: Math.round((0.6 - n * 0.045) * 100) / 100 }); }

    var stations = st.map(function (x, i) {
      var en = !!onMap[x.k], up = i % 2 === 0;
      return { x: x.x, y: x.y, name: FX[x.k].name, no: String(i + 1), sub: en ? FX[x.k].p[0][2](val(x.k, 0)) : 'BYPASS',
        ly: up ? x.y - 42 : x.y + 50, vy: up ? x.y - 28 : x.y + 64, ny: x.y + 4,
        glow: en ? 1 : 0, ring: en ? 0.9 : 0.35, dash: en ? 'none' : '3 5', fill: en ? 'rgba(63,209,160,.18)' : 'rgba(255,255,255,.02)', ink: en ? '#e8fff6' : '#5c7a70' };
    });
    var cards = order.map(function (k, i) {
      var en = !!onMap[k];
      return {
        no: String(i + 1), name: FX[k].name, op: en ? 1 : 0.6, line: en ? 'rgba(141,224,195,.3)' : 'rgba(141,224,195,.12)',
        pressed: en ? 'true' : 'false', onLabel: en ? 'ON' : 'OFF', onAria: FX[k].name + (en ? ' on' : ' off'),
        onLook: en ? 'border-color: #0b5a41; ' + on : 'border-color: rgba(255,255,255,.2); background: none; color: #cacaca;',
        toggle: function () { var nm = Object.assign({}, onMap); nm[k] = !en; self.setState({ on: nm }); },
        rows: FX[k].p.map(function (p, pi) { var v = val(k, pi); return { id: 'fx-' + k + '-' + pi, label: p[0], v: v, text: p[2](v), change: function (e) { setVal(k, pi, Number(e.target.value)); } }; }),
        first: i === 0, last: i === order.length - 1, leftOp: i === 0 ? 0.3 : 1, rightOp: i === order.length - 1 ? 0.3 : 1,
        leftAria: 'Move ' + FX[k].name + ' earlier', rightAria: 'Move ' + FX[k].name + ' later',
        left: function () { move(i, -1); }, right: function () { move(i, 1); }
      };
    });
    var tabs = [['PLAY', 'SW_Main.dc.html'], ['LAYER', 'SW_Layer.dc.html'], ['ARP', 'SW_Arp.dc.html'], ['MOD', 'SW_Mod.dc.html'], ['FX', 'SW_FX.dc.html']].map(function (x, i) {
      return { label: x[0], href: x[1], current: i === 4 ? 'page' : 'false', look: i === 4 ? 'color: #f2f2f2; box-shadow: inset 0 -2px 0 #3fd1a0;' : 'color: #8e8e8e;' };
    });
    var motionOpts = [['60', '60', 'Full motion: every display frame'], ['30', '30', 'Lighter: 30 frames a second'], ['off', 'OFF', 'No motion: a still picture (values still update it)']].map(function (x) {
      var sel = motion === x[0];
      return { label: x[1], title: x[2], on: sel ? 'true' : 'false', look: sel ? on : 'background: none; color: #8e8e8e;', pick: function () { self.setMotion(x[0]); } };
    });
    return {
      tabs: tabs, motionOpts: motionOpts, path: d, flow: f1(-(t * 30) % 12), stations: stations, cards: cards, trail: trail,
      probe: { x: f1(pp[0]), y: f1(pp[1]) },
      aria: 'Signal path: from the voice through ' + order.filter(function (k) { return onMap[k]; }).map(function (k) { return FX[k].name.toLowerCase(); }).join(', ') + ' to the output'
    };
  }
}
</script>
</body>
</html>
