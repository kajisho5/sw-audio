.disp::after,.win::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.045),transparent 32%);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.lp::before{content:"";position:absolute;inset:7px;pointer-events:none;background:radial-gradient(120% 80% at 50% 0%,rgba(255,255,255,.05),transparent 55%)}
.cn::after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffff,#8a8a8a 60%,#3a3a3a)}
.cn.tl::after{left:4px;top:4px}.cn.tr::after{right:4px;top:4px}.cn.bl::after{left:4px;bottom:4px}.cn.br::after{right:4px;bottom:4px}
.rk .kn{background:radial-gradient(circle,#2a2b2e 0 62%,transparent 63%),repeating-conic-gradient(#3f4045 0deg 3deg,#1a1b1e 3deg 6deg);box-shadow:0 6px 12px rgba(0,0,0,.75),inset 0 1px 1px rgba(255,255,255,.2)}
.rk .kn::before{content:"";position:absolute;inset:16%;border-radius:50%;background:radial-gradient(circle at 34% 26%,#57595e,#26272b 40%,#131416 80%);box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}
.tile,.chip,.bigbtn{background-image:linear-gradient(#27282c,#1d1e21);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 2px 4px rgba(0,0,0,.4)}
.chip.on,.bigbtn.on{background-image:linear-gradient(color-mix(in srgb,var(--rcol,var(--acc)) 72%,#ffffff),var(--rcol,var(--acc)));box-shadow:0 0 14px -4px var(--rcol,var(--acc)),inset 0 1px 0 rgba(255,255,255,.4)}
.evob{background:linear-gradient(#121315,#0b0c0d);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.logo{letter-spacing:.22em;gap:6px;margin-right:4px}
