.cap.ivory+.ptr i{background:#2b2111;box-shadow:none;width:4px;margin-left:-2px}
.lbl{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#e9e1cc;text-shadow:0 1px 0 rgba(0,0,0,.75);text-align:center;white-space:nowrap}

.ear{width:44px;flex:none;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:22px 0;box-shadow:inset -1px 0 0 rgba(0,0,0,.5),inset 1px 0 0 rgba(255,255,255,.18)}

.tog.dn i{top:15px}
.plate{font-family:Michroma,sans-serif;letter-spacing:.2em;color:#f1e9d4}
.eng{font-size:11px;font-weight:500;letter-spacing:.24em;color:#b5ad98;text-transform:uppercase}
