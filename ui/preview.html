<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>SW AUDIO screen preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Michroma&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="sw-ui.css">
<style>html,body{height:100%}#app{width:960px;height:550px;position:relative}</style></head>
<body><div id="app"></div>
<script src="sw-ui.js"></script>
<script>
// preview with a mock bridge (the same one the tests use): ?p=DY08
(async () => {
  const code = (new URLSearchParams(location.search).get('p') || 'DY08').toUpperCase();
  const [S, P] = await Promise.all([fetch('specs.json').then(r => r.json()), fetch('products.json').then(r => r.json())]);
  const params = S.specs[code.toLowerCase()], traits = S.traits[code.toLowerCase()];
  const vals = params.map(p => p.def); if (traits.autoGain) vals.push(0); if (traits.delta) vals.push(0);
  const listeners = [];
  const bridge = { values: () => vals, set: (i, v) => { vals[i] = v; }, begin() {}, end() {}, call() {}, onChange: cb => listeners.push(cb), info: () => ({ latencyMs: 0, cpu: 1.2, meters: [-18, -22, -6, -0.5] }) };
  window.screen_ = SWUI.mount(document.getElementById('app'), { product: P[code], params, traits, bridge });
  document.title = 'SW ' + code; window.ready = true;
})();
</script></body></html>
