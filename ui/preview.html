<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>SW AUDIO screen preview</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="sw-ui.css">
<style>html,body{height:100%}#app{position:relative}</style></head>
<body><div id="app"></div>
<script src="sw-ui.js"></script>
<script src="displays.js"></script>
<script>
// preview with a mock bridge (the same one the tests use): ?p=DY08
(async () => {
  const code = (new URLSearchParams(location.search).get('p') || 'DY08').toUpperCase();
  const useSkin = new URLSearchParams(location.search).get('skin') !== '0';
  const [S, P, K] = await Promise.all([fetch('specs.json').then(r => r.json()), fetch('products.json').then(r => r.json()), useSkin ? fetch('skins.json').then(r => r.json()) : Promise.resolve({})]);
  const params = S.specs[code.toLowerCase()], traits = S.traits[code.toLowerCase()];
  // ?rand=N: every parameter at a pseudo-random value (to find text that does not follow a parameter: tools/audit_static_text.js)
  const randSeed = +new URLSearchParams(location.search).get('rand') || 0; let rs = randSeed * 2654435761 >>> 0 || 1; const rnd = () => { rs ^= rs << 13; rs >>>= 0; rs ^= rs >> 17; rs ^= rs << 5; rs >>>= 0; return rs / 4294967296; };
  const vals = params.map(p => !randSeed ? p.def : (p.steps && p.steps.length ? p.steps[Math.floor(rnd() * p.steps.length)] : p.min + rnd() * (p.max - p.min))); if (traits.autoGain) vals.push(0); if (traits.delta) vals.push(0); if (traits.bypass) vals.push(0);
  const sim = new URLSearchParams(location.search).get('sim') === '1'; let t0 = 0;
  const simMeters = () => { t0 += 1; const a = -30 + 22 * Math.sin(t0 / 9) * Math.sin(t0 / 23), th = vals[0] === undefined ? -20 : vals[0], r = vals[1] || 2, o = a > th ? th + (a - th) / r : a; return [a, a - 1, o + 2, o + 1]; };
  const listeners = [];
  const simSpec = () => Array.from({ length: 64 }, (_, b) => -28 - 5.5 * b / 64 * 10 / 3 + 9 * Math.sin(b / 5 + t0 / 11) + 5 * Math.sin(b * 1.7 + t0 / 3) - (b > 56 ? (b - 56) * 4 : 0));
  const simStereo = () => { const o = [0.6]; for (let k = 0; k < 160; k++) { const ph = (k + t0 * 3) * 0.19, m = 0.5 * Math.sin(ph) * Math.sin(ph / 7), sd = 0.18 * Math.sin(ph * 1.3 + 1); o.push(m - sd, m + sd); } return o; };
  // VO01: a sung line with vibrato (steps through a few notes, a breath now and then) and what a major scale would make of it
  const simPitch = () => { const notes = [64, 65, 67, 69, 67, 65, 64, 62], k = Math.floor(t0 / 60), i = k % notes.length, rest = (k % 11) === 10, vib = 0.35 * Math.sin(t0 / 3.2), sung = notes[i] + vib + 0.15 * Math.sin(t0 / 1.3 + k);
    return [rest ? 0 : 1, sung, notes[i]]; };
  const simHarmony = () => { const p = simPitch(), n = Math.round(p[2]); return [p[0], p[1], p[2] + 4, p[2] + 7, p[2] - 3, p[2] + 12]; };
  const bridge = { values: () => vals, set: (i, v) => { vals[i] = v; }, begin() {}, end() {}, call() {}, onChange: cb => listeners.push(cb), info: () => ({ latencyMs: 0, cpu: 1.2, meters: sim ? simMeters() : [-18, -22, -6, -0.5], spectrum: sim ? simSpec() : undefined, readouts: sim && /^(MT01|LV23)$/.test(code) ? [-22.8 + 3 * Math.sin(t0 / 7), -23.6, -24.3, 7.4, -2.1, -24, -0.3, 1, 0, 0] : code === 'VO01' ? simPitch() : code === 'LV02' ? (() => { const o = []; const sl = [[315, 109], [1250, 12], [2500, 6]]; for (let i = 0; i < 12; i++) { const x = sl[i]; o.push(x ? x[0] : 0, x ? x[1] : 0); } o.push(0); return o; })() : code === 'LV30' ? [(t0 % 400) > 100 ? 1 : 0, t0 * 0.06, 0, 1, Math.floor(t0 / 150), 48000] : code === 'LV03' ? [(t0 % 120) > 40 ? 0 : -30, -8 * Math.abs(Math.sin(t0 / 20)), -2 * Math.abs(Math.sin(t0 / 33))] : code === 'LO03' ? [-9 * Math.abs(Math.sin(t0 / 30))] : code === 'CR01' ? (() => { const m = 0.5 + 0.5 * Math.sin(t0 / 25) * Math.sin(t0 / 61); return [m, 1200 * Math.pow(2, 5 * 0.4 * m)]; })() : code === 'VO08' ? [(t0 % 90) > 70 ? 1 : 0, (t0 % 90) > 70 ? -12 : 0, Math.floor(t0 / 90)] : code === 'VO03' ? simHarmony() : code === 'LV06' ? [-15 + 2 * Math.sin(t0 / 30), 1.8 * Math.sin(t0 / 60), -0.4, -14] : code === 'LV07' ? [-21 + 4 * Math.sin(t0 / 25), 3 + 2 * Math.sin(t0 / 25)] : /^(VO05|MS05)$/.test(code) ? [4 * Math.sin(t0 / 40), 1] : code === 'GT03' ? [110.4, 45, 6] : code === 'LV18' ? [Math.floor(t0 / 150), Math.floor(t0 / 400), 1, 0] : code === 'MD02' ? [0.8, (t0 / 75) % 1] : code === 'MD04' ? [4] : code === 'LV22' ? [0, 0.8 * Math.sin(t0 / 40), 0.3] : /^(LV05|LV29)$/.test(code) ? [-12 * (Math.sin(t0 / 30) > 0 ? 1 : 0.1), Math.sin(t0 / 30) > 0 ? 1 : 0] : /^DY0[1-8]$|^DY12$|^LV17$|^MS06$/.test(code) ? [-8 * Math.abs(Math.sin(t0 / 30))] : undefined, stereo: sim ? simStereo() : undefined }) };
  window.screen_ = SWUI.mount(document.getElementById('app'), { product: P[code], params, traits, bridge, skin: K[code] && { html: K[code].html, css: (K._base ? K._base.css : '') + K[code].css } });
  document.title = 'SW ' + code; window.ready = true;
})();
</script></body></html>
